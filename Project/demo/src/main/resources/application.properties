spring.application.name=demo

# =====================================================================
# CONFIGURAÇÃO DO BANCO DE DADOS (MySQL)
# =====================================================================
spring.config.import=optional:file:.env[.properties]
# URL de conexão: altere 'localhost:3306' e 'seu_banco_de_dados' conforme seu ambiente
spring.datasource.url=${DB_URL}

# Credenciais de acesso
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver de Conexão (Opcional a partir do Spring Boot 2.x+, pois ele detecta automaticamente pela URL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# =====================================================================
# Define a estratégia de geração de tabelas no banco de dados:
# update: Atualiza a estrutura do banco com base nas suas entidades Java sem apagar os dados.
# create-drop: Cria as tabelas ao iniciar e apaga tudo ao fechar a aplicação (bom para testes).
# none: Não faz nenhuma alteração na estrutura do banco (recomendado para produção).
spring.jpa.hibernate.ddl-auto=update

# Exibe as consultas SQL geradas pelo Hibernate no console (bom para desenvolvimento)
spring.jpa.show-sql=true

# Formata o SQL exibido no console para torná-lo legível
spring.jpa.properties.hibernate.format_sql=true
